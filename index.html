<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HCRÜ Sticker Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="stack-s">
    <h1>HCRÜ sticker vote</h1>
    <p class="lede">Two stickers at a time. Tap the one you would rather have on your laptop. Go with your gut. Do at least 30, then send your votes in.</p>
  </header>

  <section id="voting" aria-label="Pick one" class="stack-m">
    <div class="pair">
      <button class="pick" id="left" type="button" aria-label="Pick the first sticker"><img id="leftImg" alt="First sticker option" width="880" height="340"></button>
      <button class="pick" id="right" type="button" aria-label="Pick the second sticker"><img id="rightImg" alt="Second sticker option" width="880" height="340"></button>
    </div>
    <div class="row">
      <span class="status" id="status" role="status">0 votes</span>
      <span class="btns">
        <button class="btn" id="skip" type="button">Skip this pair</button>
        <button class="btn solid" id="done" type="button">Send my votes</button>
      </span>
    </div>
  </section>

  <section id="finished" class="panel" hidden>
    <h2 id="finTitle">Send your votes to Nate</h2>
    <p id="finMsg"></p>
    <div id="codeBox" class="stack-s">
      <div class="code" id="code"></div>
      <span class="btns">
        <button class="btn solid" id="share" type="button">Text my votes</button>
        <button class="btn" id="copy" type="button">Copy code</button>
        <span class="note" id="copyMsg" role="status"></span>
      </span>
    </div>
    <div><button class="btn" id="more" type="button">Keep voting</button></div>
  </section>
</main>

<script>
(function(){
  var N=36, L='abcdefghijklmnopqrstuvwxyz0123456789', MAXV=500, LS='hcru-sticker-votes';
  var $=function(id){return document.getElementById(id)};
  var src=function(i){return 'img/s'+(i<9?'0':'')+(i+1)+'.png'};
  var votes='', seen={}, counts=[], skipped={}, cur=null;

  function pkey(a,b){return a<b?a*N+b:b*N+a}
  function valid(str){
    if(typeof str!=='string'||str.length%2||str.length>MAXV*2||!/^[a-z0-9]*$/.test(str))return false;
    for(var i=0;i<str.length;i+=2){if(str[i]===str[i+1])return false}
    return true;
  }
  function applyVotes(str){
    votes=str;seen={};counts=[];for(var i=0;i<N;i++)counts.push(0);
    for(i=0;i+1<str.length;i+=2){var a=L.indexOf(str[i]),b=L.indexOf(str[i+1]);seen[pkey(a,b)]=1;counts[a]++;counts[b]++}
  }
  function nextPair(){
    var best=[],min=Infinity;
    for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){
      var k=pkey(a,b);if(seen[k]||skipped[k])continue;
      var s=counts[a]+counts[b];
      if(s<min){min=s;best=[[a,b]]}else if(s===min){best.push([a,b])}
    }
    if(!best.length)return null;
    var p=best[Math.floor(Math.random()*best.length)];
    return Math.random()<.5?p:[p[1],p[0]];
  }
  function show(){
    cur=nextPair();
    if(!cur){finish(true);return}
    $('leftImg').src=src(cur[0]);$('rightImg').src=src(cur[1]);
  }
  function statusText(){var n=votes.length/2;$('status').textContent=n+(n===1?' vote':' votes')}
  function vote(w,l){
    if(votes.length/2>=MAXV){finish(true);return}
    applyVotes(votes+L[w]+L[l]);
    try{localStorage.setItem(LS,votes)}catch(e){}
    statusText();show();
  }
  function codeText(){return 'HCRU-'+votes}
  function finish(allDone){
    var n=votes.length/2;
    $('voting').hidden=true;$('finished').hidden=false;
    $('more').hidden=!!allDone||!nextPair();
    $('copyMsg').textContent='';
    if(!n){
      $('finTitle').textContent='No votes yet';
      $('finMsg').textContent='Pick a few pairs first, then come back here to send them.';
      $('codeBox').hidden=true;return;
    }
    $('finTitle').textContent='Send your votes to Nate';
    $('finMsg').textContent='Your '+n+(n===1?' vote is':' votes are')+' packed into the code below. Text it to Nate so it gets counted. Nothing is sent until you do.';
    $('code').textContent=codeText();$('codeBox').hidden=false;
    $('share').hidden=!navigator.share;
  }

  $('left').addEventListener('click',function(){if(cur)vote(cur[0],cur[1])});
  $('right').addEventListener('click',function(){if(cur)vote(cur[1],cur[0])});
  $('skip').addEventListener('click',function(){if(cur){skipped[pkey(cur[0],cur[1])]=1;show()}});
  $('done').addEventListener('click',function(){finish(false)});
  $('more').addEventListener('click',function(){$('finished').hidden=true;$('voting').hidden=false;show()});
  $('share').addEventListener('click',function(){
    try{navigator.share({text:'My HCRÜ sticker votes: '+codeText()}).catch(function(){})}catch(e){$('copyMsg').textContent='Sharing is not available here. Copy the code instead.'}
  });
  $('copy').addEventListener('click',function(){
    var ok=function(){$('copyMsg').textContent='Copied. Now paste it in a text to Nate.'}, fail=function(){$('copyMsg').textContent='Could not copy. Press and hold the code to select it.'};
    try{navigator.clipboard.writeText(codeText()).then(ok,fail)}catch(e){fail()}
  });

  var saved='';
  try{saved=localStorage.getItem(LS)||''}catch(e){}
  applyVotes(valid(saved)?saved:'');
  statusText();show();
})();
</script>
</body>
</html>
