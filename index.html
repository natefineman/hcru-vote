<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HCRÜ Sticker Vote</title>
<meta property="og:title" content="HCRÜ sticker vote">
<meta property="og:description" content="Pick between two stickers at a time. Takes a minute.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://natefineman.github.io/hcru-vote/">
<meta property="og:image" content="https://natefineman.github.io/hcru-vote/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="stack-s">
    <h1>HCRÜ sticker vote</h1>
    <p class="lede">Two stickers at a time. Tap the one you would rather have on your laptop. Go with your gut. Every tap is counted right away, so do as many as you like and close the page whenever.</p>
  </header>

  <section id="voting" aria-label="Pick one" class="stack-m">
    <div class="pair">
      <button class="pick" id="left" type="button" aria-label="Pick the first sticker"><img id="leftImg" alt="First sticker option" width="880" height="340"></button>
      <button class="pick" id="right" type="button" aria-label="Pick the second sticker"><img id="rightImg" alt="Second sticker option" width="880" height="340"></button>
    </div>
    <div class="row">
      <span class="status" id="status" role="status">0 votes</span>
      <span class="btns">
        <button class="btn" id="skip" type="button">Skip this pair</button>
      </span>
    </div>
  </section>

  <section id="finished" class="panel" hidden>
    <h2>You have seen every pair</h2>
    <p id="finMsg">That is all of them. Thanks for voting.</p>
  </section>
</main>

<script>
(function(){
  var N=36, L='abcdefghijklmnopqrstuvwxyz0123456789', MAXV=630;
  var LS='hcru-sticker-votes', LSID='hcru-voter', LSQ='hcru-queue';
  var ENDPOINT='https://docs.google.com/forms/d/e/1FAIpQLSdTnBgprXWNUp-s9Yi7QIIKC1S9fPhsV7ejbYg88wh_Ab8Tkg/formResponse', FIELD='entry.181190500';
  var $=function(id){return document.getElementById(id)};
  var src=function(i){return 'img/s'+(i<9?'0':'')+(i+1)+'.png'};
  var votes='', seen={}, counts=[], skipped={}, cur=null, queue=[], sending=false, vid='';

  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function pkey(a,b){return a<b?a*N+b:b*N+a}
  function valid(str){
    if(typeof str!=='string'||str.length%2||str.length>MAXV*2||!/^[a-z0-9]*$/.test(str))return false;
    for(var i=0;i<str.length;i+=2){if(str[i]===str[i+1])return false}
    return true;
  }
  function applyVotes(str){
    votes=str;seen={};counts=[];for(var i=0;i<N;i++)counts.push(0);
    for(i=0;i+1<str.length;i+=2){var a=L.indexOf(str[i]),b=L.indexOf(str[i+1]);seen[pkey(a,b)]=1;counts[a]++;counts[b]++}
  }
  function nextPair(){
    var best=[],min=Infinity;
    for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){
      var k=pkey(a,b);if(seen[k]||skipped[k])continue;
      var s=counts[a]+counts[b];
      if(s<min){min=s;best=[[a,b]]}else if(s===min){best.push([a,b])}
    }
    if(!best.length)return null;
    var p=best[Math.floor(Math.random()*best.length)];
    return Math.random()<.5?p:[p[1],p[0]];
  }
  function show(){
    cur=nextPair();
    if(!cur){$('voting').hidden=true;$('finished').hidden=false;return}
    $('leftImg').src=src(cur[0]);$('rightImg').src=src(cur[1]);
  }
  function statusText(){
    var n=votes.length/2,t=n+(n===1?' vote counted':' votes counted');
    if(n>=30)t+='. That is plenty, thanks. Keep going if you like.';
    $('status').textContent=t;
  }

  /* Each tap is posted on its own. Anything that fails to send stays queued and is retried. */
  function flush(){
    if(sending||!queue.length)return;
    sending=true;
    var item=queue[0],body=new URLSearchParams();body.append(FIELD,item);
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:body}).then(function(){
      queue.shift();set(LSQ,JSON.stringify(queue));sending=false;flush();
    },function(){sending=false;setTimeout(flush,5000)});
  }
  function vote(w,l){
    if(votes.length/2>=MAXV)return;
    applyVotes(votes+L[w]+L[l]);set(LS,votes);
    queue.push(vid+':'+L[w]+'>'+L[l]);set(LSQ,JSON.stringify(queue));
    statusText();flush();show();
  }

  $('left').addEventListener('click',function(){if(cur)vote(cur[0],cur[1])});
  $('right').addEventListener('click',function(){if(cur)vote(cur[1],cur[0])});
  $('skip').addEventListener('click',function(){if(cur){skipped[pkey(cur[0],cur[1])]=1;show()}});
  window.addEventListener('online',flush);

  vid=get(LSID)||'';
  if(!/^[a-z0-9]{8}$/.test(vid)){vid='';for(var i=0;i<8;i++)vid+=L[Math.floor(Math.random()*36)];set(LSID,vid)}
  var saved=get(LS)||'';
  applyVotes(valid(saved)?saved:'');
  try{var q=JSON.parse(get(LSQ)||'[]');if(Array.isArray(q))queue=q.filter(function(x){return typeof x==='string'&&/^[a-z0-9]{8}:[a-z0-9]>[a-z0-9]$/.test(x)})}catch(e){}
  /* votes cast before taps were sent automatically: queue them once */
  if(!get('hcru-synced')){
    for(var j=0;j+1<votes.length;j+=2)queue.push(vid+':'+votes[j]+'>'+votes[j+1]);
    set(LSQ,JSON.stringify(queue));set('hcru-synced','1');
  }
  statusText();show();flush();
})();
</script>
</body>
</html>
