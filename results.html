<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HCRÜ Sticker Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="stack-s">
    <h1>HCRÜ sticker results</h1>
    <p class="lede">Open the responses sheet, copy the whole "tap" column, and paste it here. Pasting again later is fine: taps already counted are skipped.</p>
  </header>

  <section class="stack-s">
    <label for="paste">Taps from the sheet</label>
    <textarea id="paste" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="k3f9x2ab:a>j"></textarea>
    <span class="btns">
      <button class="btn solid" id="add" type="button">Count these taps</button>
      <button class="btn" id="clear" type="button">Start over</button>
      <span class="note" id="msg" role="status"></span>
    </span>
  </section>

  <section class="panel">
    <h2>Ranking</h2>
    <p id="summary" class="status"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Rank</th><th>Sticker</th><th class="num">No.</th><th class="num">Rating</th><th class="num">Won</th><th class="num">Lost</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function(){
  var N=36, L='abcdefghijklmnopqrstuvwxyz0123456789', LS='hcru-sticker-taps';
  var $=function(id){return document.getElementById(id)};
  var src=function(i){return 'img/s'+(i<9?'0':'')+(i+1)+'.png'};
  var taps={}; /* key: voter + unordered pair -> "w>l"; one tap per voter per pair */

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function ratings(games){
    /* Elo, K=24, averaged over 40 shuffled orders so the result does not depend on vote order */
    var P=40,sum=[],i,p,r,rand=rng(20261112);
    for(i=0;i<N;i++)sum.push(0);
    for(p=0;p<P;p++){
      var g=games.slice();
      for(i=g.length-1;i>0;i--){var j=Math.floor(rand()*(i+1)),t=g[i];g[i]=g[j];g[j]=t}
      r=[];for(i=0;i<N;i++)r.push(1000);
      g.forEach(function(m){var e=1/(1+Math.pow(10,(r[m[1]]-r[m[0]])/400)),d=24*(1-e);r[m[0]]+=d;r[m[1]]-=d});
      for(i=0;i<N;i++)sum[i]+=r[i];
    }
    return sum.map(function(x){return x/P});
  }
  function save(){try{localStorage.setItem(LS,JSON.stringify(taps))}catch(e){}}
  function render(){
    var games=[],won=[],lost=[],voters={},i,k;
    for(i=0;i<N;i++){won.push(0);lost.push(0)}
    for(k in taps){var w=L.indexOf(taps[k][0]),l=L.indexOf(taps[k][2]);games.push([w,l]);won[w]++;lost[l]++;voters[k.split(':')[0]]=1}
    var nv=Object.keys(voters).length,r=ratings(games),order=[];
    for(i=0;i<N;i++)order.push(i);
    order.sort(function(a,b){return r[b]-r[a]||a-b});
    $('summary').textContent=games.length+(games.length===1?' vote':' votes')+' from '+nv+(nv===1?' person':' people')+(games.length<400?'. Rankings are rough until there are several hundred votes.':'.');
    var body=$('body');body.textContent='';
    order.forEach(function(s,n){
      var tr=document.createElement('tr');
      function td(text,cls){var c=document.createElement('td');if(cls)c.className=cls;c.textContent=text;tr.appendChild(c);return c}
      td(String(n+1));
      var c=td(''),sp=document.createElement('span'),im=document.createElement('img');
      sp.className='thumb';im.src=src(s);im.alt='Sticker '+(s+1);im.width=150;im.height=58;im.loading='lazy';sp.appendChild(im);c.appendChild(sp);
      td(String(s+1),'num');td(String(Math.round(r[s])),'num');td(String(won[s]),'num');td(String(lost[s]),'num');
      body.appendChild(tr);
    });
  }

  $('add').addEventListener('click',function(){
    var text=$('paste').value,re=/(?:^|[^a-z0-9])([a-z0-9]{8}):([a-z0-9])>([a-z0-9])(?![a-z0-9])/g,m,added=0,dupes=0;
    while((m=re.exec(text))){
      if(m[2]===m[3])continue;
      var pair=m[2]<m[3]?m[2]+m[3]:m[3]+m[2],key=m[1]+':'+pair;
      if(taps[key]){dupes++}else{taps[key]=m[2]+'>'+m[3];added++}
    }
    $('msg').textContent=added||dupes?('Added '+added+(dupes?', skipped '+dupes+' already counted':'')+'.'):'No taps found. Copy the tap column from the responses sheet.';
    if(added){$('paste').value='';save();render()}
  });
  var armed=false;
  $('clear').addEventListener('click',function(){
    if(!armed){armed=true;this.textContent='Tap again to clear everything';return}
    armed=false;this.textContent='Start over';taps={};save();render();$('msg').textContent='Cleared.';
  });

  try{var s=JSON.parse(localStorage.getItem(LS)||'{}');if(s&&typeof s==='object'&&!Array.isArray(s))taps=s}catch(e){}
  render();
})();
</script>
</body>
</html>
