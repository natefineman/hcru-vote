<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HCRÜ Sticker Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="stack-s">
    <h1>HCRÜ sticker results</h1>
    <p class="lede">Paste the vote codes people text you. You can paste whole messages, several at once. Ballots are kept in this browser only, so tally on one device.</p>
  </header>

  <section class="stack-s">
    <label for="paste">Vote codes</label>
    <textarea id="paste" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="My HCRÜ sticker votes: HCRU-..."></textarea>
    <span class="btns">
      <button class="btn solid" id="add" type="button">Add ballots</button>
      <button class="btn" id="clear" type="button">Remove all ballots</button>
      <span class="note" id="msg" role="status"></span>
    </span>
  </section>

  <section class="panel">
    <h2>Ranking</h2>
    <p id="summary" class="status"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Rank</th><th>Sticker</th><th class="num">No.</th><th class="num">Rating</th><th class="num">Won</th><th class="num">Lost</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function(){
  var N=36, L='abcdefghijklmnopqrstuvwxyz0123456789', MAXV=500, LS='hcru-sticker-ballots';
  var $=function(id){return document.getElementById(id)};
  var src=function(i){return 'img/s'+(i<9?'0':'')+(i+1)+'.png'};
  var ballots=[];

  function valid(str){
    if(typeof str!=='string'||!str||str.length%2||str.length>MAXV*2||!/^[a-z0-9]*$/.test(str))return false;
    for(var i=0;i<str.length;i+=2){if(str[i]===str[i+1])return false}
    return true;
  }
  function parse(str){var out=[];for(var i=0;i+1<str.length;i+=2){out.push([L.indexOf(str[i]),L.indexOf(str[i+1])])}return out}
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function ratings(games){
    /* Elo, K=24, averaged over 40 shuffled orders so the result does not depend on vote order */
    var P=40,sum=[],i,p,r,rand=rng(20261112);
    for(i=0;i<N;i++)sum.push(0);
    for(p=0;p<P;p++){
      var g=games.slice();
      for(i=g.length-1;i>0;i--){var j=Math.floor(rand()*(i+1)),t=g[i];g[i]=g[j];g[j]=t}
      r=[];for(i=0;i<N;i++)r.push(1000);
      g.forEach(function(m){var e=1/(1+Math.pow(10,(r[m[1]]-r[m[0]])/400)),d=24*(1-e);r[m[0]]+=d;r[m[1]]-=d});
      for(i=0;i<N;i++)sum[i]+=r[i];
    }
    return sum.map(function(x){return x/P});
  }
  function save(){try{localStorage.setItem(LS,JSON.stringify(ballots))}catch(e){}}
  function render(){
    var games=[],won=[],lost=[],i;
    for(i=0;i<N;i++){won.push(0);lost.push(0)}
    ballots.forEach(function(b){parse(b).forEach(function(m){games.push(m);won[m[0]]++;lost[m[1]]++})});
    var r=ratings(games),order=[];
    for(i=0;i<N;i++)order.push(i);
    order.sort(function(a,b){return r[b]-r[a]||a-b});
    $('summary').textContent=games.length+(games.length===1?' vote':' votes')+' from '+ballots.length+(ballots.length===1?' ballot':' ballots')+(games.length<400?'. Rankings are rough until there are several hundred votes.':'.');
    var body=$('body');body.textContent='';
    order.forEach(function(s,k){
      var tr=document.createElement('tr');
      function td(text,cls){var c=document.createElement('td');if(cls)c.className=cls;c.textContent=text;tr.appendChild(c);return c}
      td(String(k+1));
      var c=td(''),sp=document.createElement('span'),im=document.createElement('img');
      sp.className='thumb';im.src=src(s);im.alt='Sticker '+(s+1);im.width=150;im.height=58;im.loading='lazy';sp.appendChild(im);c.appendChild(sp);
      td(String(s+1),'num');td(String(Math.round(r[s])),'num');td(String(won[s]),'num');td(String(lost[s]),'num');
      body.appendChild(tr);
    });
  }

  $('add').addEventListener('click',function(){
    var text=$('paste').value,re=/HCRU-([a-z0-9]+)/gi,m,added=0,dupes=0,bad=0;
    while((m=re.exec(text))){
      var code=m[1].toLowerCase();
      if(!valid(code)){bad++;continue}
      /* a longer code from the same person replaces their shorter one */
      var replaced=false;
      for(var i=0;i<ballots.length;i++){
        if(ballots[i]===code){dupes++;replaced=true;break}
        if(code.indexOf(ballots[i])===0){ballots[i]=code;added++;replaced=true;break}
        if(ballots[i].indexOf(code)===0){dupes++;replaced=true;break}
      }
      if(!replaced){ballots.push(code);added++}
    }
    var parts=[];
    if(added)parts.push('Added '+added+'.');
    if(dupes)parts.push(dupes+' already counted.');
    if(bad)parts.push(bad+' could not be read.');
    $('msg').textContent=parts.length?parts.join(' '):'No vote codes found. Each one starts with HCRU-.';
    if(added){$('paste').value='';save();render()}
  });
  var armed=false;
  $('clear').addEventListener('click',function(){
    if(!armed){armed=true;this.textContent='Tap again to remove all';return}
    armed=false;this.textContent='Remove all ballots';ballots=[];save();render();$('msg').textContent='All ballots removed.';
  });

  try{var s=JSON.parse(localStorage.getItem(LS)||'[]');if(Array.isArray(s))ballots=s.filter(valid)}catch(e){}
  render();
})();
</script>
</body>
</html>
